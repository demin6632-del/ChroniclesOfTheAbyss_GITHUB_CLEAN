name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o ChroniclesOfTheAbyss_ANDROID_READY.zip -d android_project

      - name: Find Gradle wrapper
        run: |
          find android_project -name gradlew

      - name: Build debug APK
        run: |
          GRADLEW=$(find android_project -name gradlew | head -1)
          chmod +x "$GRADLEW"
          cd $(dirname "$GRADLEW")
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
